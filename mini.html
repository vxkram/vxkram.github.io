<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vikram Aditya</title>
  <meta name="description" content="Vikram Aditya, Associate Engineer at ThoughtFocus in Bengaluru. The short version.">
  <meta name="theme-color" content="#e7dcc5">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500&family=Reenie+Beanie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./mini.css?v=20261019d">
</head>
<body>
  <!-- Pencil filter: roughens any line it's applied to so it reads as hand drawn. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main class="sheet">
    <section class="me">
      <div class="avatar">
        <img src="https://github.com/vxkram.png?size=240" width="120" height="120" alt="Vikram Aditya">
        <svg class="frame" viewBox="0 0 120 120" aria-hidden="true" preserveAspectRatio="none"><rect x="2" y="2" width="116" height="116" rx="3"/><rect x="4" y="3" width="113" height="115" rx="3"/></svg>
      </div>
      <h1>Vikram Aditya</h1>
      <p class="role">Associate Engineer at ThoughtFocus, Bengaluru</p>
      <p class="tagline">Building things that should probably exist.</p>
      <p class="links">
        <a class="arrow" href="https://github.com/vxkram">github</a>
        <a class="arrow" href="https://www.linkedin.com/in/rvikramaditya/">linkedin</a>
        <a class="arrow" href="mailto:vikramaditya2805@gmail.com">mail</a>
      </p>
    </section>

    <section class="activity" aria-labelledby="h-activity">
      <div class="head">
        <h2 id="h-activity">git</h2>
        <p class="count" id="activity-count"></p>
      </div>
      <div id="activity-grid" class="grid-wrap"></div>
    </section>

    <div class="below">
    <section class="work" aria-labelledby="h-work">
      <h2 id="h-work">work</h2>
      <p class="job">Associate Engineer</p>
      <p class="meta">ThoughtFocus, Bengaluru, 2025 – present</p>
    </section>

    <section class="badges" id="badges" aria-labelledby="h-badges" hidden>
      <h2 id="h-badges">badges <a class="arrow" id="credly-link" href="#">credly</a></h2>
      <ul id="badge-list"></ul>
    </section>
    </div>

    <section class="projects" aria-labelledby="h-projects">
      <h2 id="h-projects">projects</h2>
      <div class="carousel">
        <button class="nav prev" type="button" aria-label="Previous project">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
        </button>
        <div class="slide" id="slide" aria-live="polite"></div>
        <button class="nav next" type="button" aria-label="Next project">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>
        </button>
      </div>
      <p class="pager" id="pager"></p>
    </section>

    <p class="switch"><a class="arrow" href="./index.html">full site</a></p>
  </main>

  <script src="./mini.js?v=20261019d"></script>
</body>
</html>
